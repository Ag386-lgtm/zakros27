<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حامي القلب - Heart Defender</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- شاشة التحميل -->
<div id="loading" class="overlay">
  <h1>جاري التحميل...</h1>
</div>

<!-- شاشة البداية -->
<div id="start-screen" class="overlay hidden">
  <h1 style="color: #2ecc71;">حامي القلب 🛡️</h1>
  <p>القلب في خطر! جراثيم تطير من حوله وتحاول اختراقه. انقر عليها بسرعة لتدميرها قبل أن تصل. إذا وصلت إلى 200 نقطة، تفوز!</p>
  <button id="start-btn">ابدأ المهمة</button>
</div>

<!-- شاشة النهاية -->
<div id="end-screen" class="overlay hidden">
  <h1 id="end-title">انتهت اللعبة</h1>
  <p id="end-message"></p>
  <p>نقاطك النهائية: <span id="final-score">0</span></p>
  <button id="restart-btn">العب مرة أخرى</button>
</div>

<!-- واجهة اللعب (النقاط والأرواح) -->
<div class="hud">
  <div class="box">
    النقاط: <span id="score">0</span>
    <span class="level">المستوى: <span id="level">1</span></span>
  </div>
  <div class="box lives" id="lives-display">❤️❤️❤️</div>
</div>

<!-- تأثير الضرر -->
<div id="damage-flash"></div>

<!-- حاوية اللعبة ثلاثية الأبعاد -->
<div id="game-container"></div>

<!-- تحميل السكريبتات بالترتيب -->
<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
