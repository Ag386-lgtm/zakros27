
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اقض على الجراثيم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
  body { background: #050a14; color: #fff; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }

  /* واجهة المستخدم */
  .hud { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
  .box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 12px; font-size: 20px; font-weight: bold; border: 1px solid #333; }
  .score { color: #2ecc71; }
  .lives { color: #e74c3c; font-size: 24px; letter-spacing: 3px; }

  /* شاشات البداية والنهاية */
  .overlay { position: fixed; inset: 0; background: rgba(5, 10, 20, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 45px; color: #2ecc71; margin-bottom: 20px; text-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
  .overlay p { font-size: 18px; color: #aaa; margin-bottom: 30px; max-width: 400px; line-height: 1.6; }
  .overlay button { padding: 15px 50px; font-size: 22px; font-weight: bold; background: #2ecc71; color: #000; border: none; border-radius: 50px; cursor: pointer; transition: 0.2s; }
  .overlay button:hover { transform: scale(1.1); background: #27ae60; }

  /* تأثير الضرر */
  .damage-flash { position: fixed; inset: 0; background: rgba(231, 76, 60, 0.4); opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.1s; }
</style>
</head>
<body>

<div class="hud">
  <div class="box score">النقاط: <span id="score">0</span></div>
  <div class="box lives">❤️ <span id="lives">3</span></div>
</div>

<div id="damage-flash" class="damage-flash"></div>

<div id="start-screen" class="overlay">
  <h1>اقض على الجراثيم! 🦠</h1>
  <p>القلب في خطر! جراثيم تطير من حوله. انقر عليها بسرعة لتدميرها قبل أن تصل إلى القلب. لديك 3 محاولات فقط!</p>
  <button id="start-btn">ابدأ اللعب</button>
</div>

<div id="end-screen" class="overlay hidden">
  <h1 id="end-title">انتهت اللعبة</h1>
  <p>نقاطك النهائية: <span id="final-score" style="color:#2ecc71; font-size: 24px; font-weight:bold;">0</span></p>
  <button id="restart-btn">العب مرة أخرى</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// ==================== إعداد المشهد ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050a14);
scene.fog = new THREE.Fog(0x050a14, 10, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// إضاءة
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const pointLight = new THREE.PointLight(0xffffff, 1.5, 20);
pointLight.position.set(0, 0, 5);
scene.add(pointLight);

// ==================== بناء القلب (مجسم مركزي) ====================
const heartGroup = new THREE.Group();
const heartMat = new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.3, metalness: 0.2, emissive: 0x220000 });
const heartGeo = new THREE.SphereGeometry(1.5, 32, 32);
const heartMesh = new THREE.Mesh(heartGeo, heartMat);
heartMesh.scale.set(1, 1.2, 0.9);
heartGroup.add(heartMesh);
scene.add(heartGroup);

// هالة حول القلب
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(1.7, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.05, side: THREE.BackSide })
);
heartGroup.add(halo);

// ==================== الجراثيم ====================
const enemies = [];
const enemyGeo = new THREE.SphereGeometry(0.35, 16, 16);
const enemyMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, emissive: 0x115522, roughness: 0.2 });

function spawnEnemy() {
  // إنشاء جرثومة
  const mesh = new THREE.Mesh(enemyGeo, enemyMat.clone());
  // موقع عشوائي على حافة الشاشة (بعيداً عن المركز)
  const angle = Math.random() * Math.PI * 2;
  const radius = 12; // يبدأ من بعيد
  mesh.position.set(
    Math.cos(angle) * radius,
    Math.sin(angle) * radius * 0.7,
    (Math.random() - 0.5) * 2
  );
  mesh.userData = {
    speed: 0.02 + Math.random() * 0.03, // سرعة عشوائية
    active: true
  };
  // إضافة تأثير وميض للجرثومة
  mesh.userData.pulse = Math.random() * Math.PI * 2;
  scene.add(mesh);
  enemies.push(mesh);
}

// ==================== إعدادات اللعبة ====================
let score = 0;
let lives = 3;
let isPlaying = false;
let spawnTimer = 0;
let gameSpeedMultiplier = 1;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const finalScoreEl = document.getElementById('final-score');
const endTitle = document.getElementById('end-title');
const damageFlash = document.getElementById('damage-flash');

// مؤثر اهتزاز الشاشة
function shakeScreen() {
  camera.position.x = (Math.random() - 0.5) * 0.5;
  camera.position.y = (Math.random() - 0.5) * 0.5;
  setTimeout(() => {
    camera.position.x = 0;
    camera.position.y = 0;
  }, 100);
}

// وميض أحمر عند الضرر
function triggerDamage() {
  damageFlash.style.opacity = '1';
  setTimeout(() => { damageFlash.style.opacity = '0'; }, 200);
}

// بدء اللعبة
function startGame() {
  score = 0;
  lives = 3;
  isPlaying = true;
  gameSpeedMultiplier = 1;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  
  // إزالة أي جراثيم قديمة
  enemies.forEach(e => scene.remove(e));
  enemies.length = 0;
}

// إنهاء اللعبة
function endGame(win = false) {
  isPlaying = false;
  finalScoreEl.textContent = score;
  endTitle.textContent = win ? "أنقذت القلب!" : "انتهت اللعبة";
  endScreen.classList.remove('hidden');
}

// ==================== التفاعل (النقر على الجراثيم) ====================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown', (event) => {
  if (!isPlaying) return;

  // تحويل إحداثيات النقر إلى إحداثيات ثلاثية الأبعاد
  mouse.x = (event.clientX / innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(enemies);

  if (intersects.length > 0) {
    const hitEnemy = intersects[0].object;
    if (hitEnemy.userData.active) {
      hitEnemy.userData.active = false;
      scene.remove(hitEnemy);
      // إزالة من المصفوفة
      const idx = enemies.indexOf(hitEnemy);
      if (idx > -1) enemies.splice(idx, 1);
      
      // زيادة النقاط
      score += 10;
      scoreEl.textContent = score;
      
      // تسريع اللعبة تدريجياً
      if (score % 50 === 0) gameSpeedMultiplier += 0.2;
    }
  }
});

// ==================== حلقة اللعبة (الرسم والتحديث) ====================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // دوران القلب
  heartGroup.rotation.y += 0.005;
  heartGroup.rotation.x = Math.sin(time) * 0.1;

  // نبض القلب
  const pulse = 1 + Math.sin(time * 5) * 0.03;
  heartMesh.scale.set(1 * pulse, 1.2 * pulse, 0.9 * pulse);

  if (isPlaying) {
    // توليد جراثيم جديدة
    spawnTimer += delta;
    const spawnRate = Math.max(0.3, 1 - (gameSpeedMultiplier * 0.1)); // كلما زادت السرعة، قل وقت التوليد
    if (spawnTimer > spawnRate) {
      spawnEnemy();
      spawnTimer = 0;
    }

    // تحديث حركة الجراثيم
    for (let i = enemies.length - 1; i >= 0; i--) {
      const enemy = enemies[i];
      if (!enemy.userData.active) continue;

      // التحرك باتجاه المركز (0,0,0)
      const direction = new THREE.Vector3(0, 0, 0).sub(enemy.position).normalize();
      enemy.position.add(direction.multiplyScalar(enemy.userData.speed * gameSpeedMultiplier));

      // نبض الجرثومة
      enemy.userData.pulse += delta * 5;
      const s = 1 + Math.sin(enemy.userData.pulse) * 0.2;
      enemy.scale.set(s, s, s);

      // التحقق من الوصول للقلب
      if (enemy.position.length() < 2.0) {
        // ضرر!
        lives--;
        livesEl.textContent = lives;
        triggerDamage();
        shakeScreen();
        
        scene.remove(enemy);
        enemies.splice(i, 1);

        if (lives <= 0) {
          endGame(false);
        }
      }
    }
  }

  renderer.render(scene, camera);
}

animate();

// استجابة الشاشة
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// أزرار التحكم
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

</script>
</body>
</html>
