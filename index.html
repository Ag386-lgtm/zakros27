<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تشريح القلب التفاعلي 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <aside id="panel">
    <h1>تشريح القلب 3D</h1>
    <p class="hint">انقر على أي جزء من القلب لعرض تفاصيله التشريحية. اسحب للتدوير، وعجلة الماوس للتكبير.</p>

    <div id="info">
      <h2>لم تختر جزءاً بعد</h2>
      <p>اضغط على أي جزء من مجسم القلب في الشاشة لقراءة تفاصيله.</p>
    </div>

    <button id="reset">إعادة ضبط الكاميرا</button>
    
    <h3>قائمة الأجزاء:</h3>
    <ul id="parts-list"></ul>
  </aside>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
