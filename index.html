<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تشريح جسم الإنسان ثلاثي الأبعاد</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <aside id="panel">
    <h1>تشريح جسم الإنسان</h1>
    <p class="hint">انقر على أي عضو لعرض تفاصيله. اسحب للتدوير، عجلة الماوس للتكبير.</p>

    <div class="tabs">
      <button class="tab active" data-system="all">الكل</button>
      <button class="tab" data-system="heart">القلب</button>
      <button class="tab" data-system="digestive">الهضمي</button>
      <button class="tab" data-system="skeleton">الهيكل</button>
    </div>

    <div id="info">
      <h2>لم تختر عضواً بعد</h2>
      <p>انقر على أي جزء في المشهد.</p>
    </div>

    <button id="reset">إعادة ضبط الكاميرا</button>
    <ul id="parts-list"></ul>
  </aside>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
