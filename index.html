<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة توصيل الصور بالكلمات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
  body { background: #1a1a2e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* العنوان */
  .header { text-align: center; padding: 15px; background: #16213e; border-bottom: 2px solid #0f3460; }
  .header h1 { color: #e94560; font-size: 28px; }
  .header p { color: #a0a0b0; font-size: 14px; margin-top: 5px; }

  /* حاوية الصور */
  .images-container { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; flex: 1; align-items: center; }
  
  .image-card {
    width: 160px; height: 160px;
    background: #0f3460; border: 3px dashed #533483; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; transition: 0.3s; overflow: hidden;
  }
  .image-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 13px; display: none; }
  .image-card .placeholder { font-size: 40px; color: #533483; }
  .image-card.empty { background: #0f3460; }
  .image-card.filled { border: 3px solid #2ecc71; background: #1a3d2e; }
  .image-card .word-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(46, 204, 113, 0.9); color: white; padding: 5px;
    text-align: center; font-weight: bold; font-size: 16px; display: none;
  }
  .image-card.filled .word-label { display: block; }
  
  /* حاوية الكلمات */
  .words-container { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; background: #16213e; border-top: 2px solid #0f3460; min-height: 120px; }
  
  .word {
    padding: 12px 25px; background: #e94560; color: white; border-radius: 50px;
    font-size: 18px; font-weight: bold; cursor: grab; transition: 0.2s;
    box-shadow: 0 4px 10px rgba(233, 69, 96, 0.3);
  }
  .word:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(233, 69, 96, 0.5); }
  .word.dragging { opacity: 0.5; cursor: grabbing; }
  .word.used { display: none; }

  /* شاشة النهاية */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
  .overlay.show { display: flex; }
  .overlay h1 { color: #2ecc71; font-size: 40px; margin-bottom: 20px; }
  .overlay button { padding: 15px 40px; font-size: 20px; background: #e94560; color: white; border: none; border-radius: 30px; cursor: pointer; margin-top: 20px; }
</style>
</head>
<body>

<div class="header">
  <h1>🧩 طابق الصورة مع الكلمة</h1>
  <p>اسحب الكلمة في الأسفل وضعها على الصورة المناسبة</p>
</div>

<!-- الصور (غيّر مسارات الصور هنا) -->
<div class="images-container" id="images-container">
  <!-- سيتم إنشاء البطاقات ديناميكياً بالـ JavaScript -->
</div>

<!-- الكلمات (غيّر الكلمات هنا) -->
<div class="words-container" id="words-container">
  <!-- سيتم إنشاء الكلمات ديناميكياً بالـ JavaScript -->
</div>

<!-- شاشة الفوز -->
<div class="overlay" id="win-screen">
  <h1>🎉 أحسنت! لقد أكملت اللعبة</h1>
  <button onclick="location.reload()">العب مرة أخرى</button>
</div>

<script>
// ==================== إعدادات اللعبة ====================
// هنا تقوم بتغيير الصور والكلمات
// تأكد أن الصور مرفوعة في نفس المجلد
const gameData = [
  { image: 'cat.jpg',   word: 'قطة' },
  { image: 'dog.jpg',   word: 'كلب' },
  { image: 'apple.jpg', word: 'تفاحة' },
  { image: 'car.jpg',   word: 'سيارة' }
];

// ==================== المتغيرات ====================
let score = 0;
const totalItems = gameData.length;
let draggedWord = null;

const imagesContainer = document.getElementById('images-container');
const wordsContainer = document.getElementById('words-container');
const winScreen = document.getElementById('win-screen');

// ==================== إنشاء الصور والكلمات ====================
function initGame() {
  // 1. إنشاء بطاقات الصور
  gameData.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'image-card empty';
    card.dataset.correctWord = item.word;
    card.dataset.index = index;

    card.innerHTML = `
      <div class="placeholder">🖼️</div>
      <img src="${item.image}" alt="${item.word}" onload="this.style.display='block'; this.parentElement.querySelector('.placeholder').style.display='none';">
      <div class="word-label"></div>
    `;

    // أحداث السحب والإفلات للبطاقة
    card.addEventListener('dragover', (e) => {
      e.preventDefault(); // السماح بالإفلات
      if (!card.classList.contains('filled')) {
        card.style.borderColor = '#2ecc71';
        card.style.transform = 'scale(1.05)';
      }
    });

    card.addEventListener('dragleave', (e) => {
      if (!card.classList.contains('filled')) {
        card.style.borderColor = '#533483';
        card.style.transform = 'scale(1)';
      }
    });

    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.style.borderColor = '#533483';
      card.style.transform = 'scale(1)';
      
      if (card.classList.contains('filled')) return; // إذا كانت مملوءة مسبقاً
      
      const wordText = e.dataTransfer.getData('text/plain');
      
      if (wordText === card.dataset.correctWord) {
        // إجابة صحيحة
        card.classList.remove('empty');
        card.classList.add('filled');
        card.querySelector('.word-label').textContent = wordText;
        
        // إخفاء الكلمة التي تم استخدامها
        const usedWord = document.querySelector(`.word[data-word="${wordText}"]`);
        if (usedWord) usedWord.classList.add('used');
        
        score++;
        checkWin();
      } else {
        // إجابة خاطئة
        card.style.backgroundColor = '#4a1a1a';
        card.style.borderColor = '#e74c3c';
        setTimeout(() => {
          card.style.backgroundColor = '';
          card.style.borderColor = '#533483';
        }, 500);
      }
    });

    imagesContainer.appendChild(card);
  });

  // 2. إنشاء الكلمات
  // نخلط ترتيب الكلمات
  const shuffledWords = [...gameData].sort(() => Math.random() - 0.5);

  shuffledWords.forEach(item => {
    const wordEl = document.createElement('div');
    wordEl.className = 'word';
    wordEl.textContent = item.word;
    wordEl.setAttribute('draggable', 'true');
    wordEl.dataset.word = item.word;

    wordEl.addEventListener('dragstart', (e) => {
      draggedWord = wordEl;
      wordEl.classList.add('dragging');
      e.dataTransfer.setData('text/plain', item.word);
    });

    wordEl.addEventListener('dragend', () => {
      wordEl.classList.remove('dragging');
      draggedWord = null;
    });

    wordsContainer.appendChild(wordEl);
  });
}

// ==================== التحقق من الفوز ====================
function checkWin() {
  if (score === totalItems) {
    setTimeout(() => {
      winScreen.classList.add('show');
    }, 500);
  }
}

// ==================== التشغيل ====================
initGame();
</script>
</body>
</html>
