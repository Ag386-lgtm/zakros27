<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حامي القلب - 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
  body { background: #050a14; color: #fff; overflow: hidden; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .box { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 20px; font-weight: bold; border: 1px solid #1e3a5f; }
  #score { color: #2ecc71; }
  #lives { color: #e74c3c; font-size: 24px; letter-spacing: 4px; }
  .overlay { position: absolute; inset: 0; background: rgba(5,10,20,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 42px; margin-bottom: 15px; }
  .overlay p { font-size: 16px; color: #aaa; max-width: 450px; line-height: 1.6; margin-bottom: 25px; }
  .overlay button { padding: 15px 50px; font-size: 22px; font-weight: bold; background: #2ecc71; color: #000; border: none; border-radius: 40px; cursor: pointer; transition: 0.2s; }
  .overlay button:hover { background: #27ae60; transform: scale(1.05); }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <div class="box">النقاط: <span id="score">0</span></div>
  <div class="box" id="lives">❤️❤️❤️</div>
</div>

<div id="start-screen" class="overlay">
  <h1 style="color:#2ecc71;">حامي القلب 🫀</h1>
  <p>جراثيم تطير حول القلب. انقر عليها بسرعة لتدميرها. لديك 3 أرواح وهدفك 200 نقطة!</p>
  <button id="start-btn">ابدأ اللعب</button>
</div>

<div id="end-screen" class="overlay hidden">
  <h1 id="end-title">انتهت اللعبة</h1>
  <p id="end-msg"></p>
  <button id="restart-btn">العب مرة أخرى</button>
</div>

<script>
// ==================== إعداد اللوحة ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

// ==================== متغيرات ====================
let score = 0, lives = 3, level = 1, playing = false;
let enemies = [], particles = [], spawnTimer = 0, lastTime = 0;
const WIN = 200;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const endTitle = document.getElementById('end-title');
const endMsg = document.getElementById('end-msg');

// ==================== دوال مساعدة ====================
function updateLives() {
  livesEl.innerHTML = '❤️'.repeat(lives) + '🖤'.repeat(Math.max(0, 3 - lives));
}

function spawnEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.max(W, H) * 0.7;
  const speed = 1.5 + Math.random() * 1.5 + level * 0.3;
  enemies.push({
    x: W/2 + Math.cos(angle) * radius,
    y: H/2 + Math.sin(angle) * radius,
    z: Math.random() * 2 - 1,
    r: 14 + Math.random() * 8,
    speed: speed,
    pulse: Math.random() * Math.PI * 2,
    color: `hsl(${120 + Math.random() * 40},70%,50%)`
  });
}

function explode(x, y, color) {
  for (let i = 0; i < 15; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color, size: 2+Math.random()*4 });
  }
}

// ==================== رسم القلب 3D مبسط ====================
function drawHeart(time) {
  const cx = W/2, cy = H/2;
  const pulse = 1 + Math.sin(time * 0.005) * 0.08;
  const size = Math.min(W, H) * 0.12 * pulse;

  // هالة
  const g = ctx.createRadialGradient(cx, cy, size*0.5, cx, cy, size*3);
  g.addColorStop(0, 'rgba(255,50,50,0.2)');
  g.addColorStop(1, 'rgba(255,50,50,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, size*3, 0, Math.PI*2); ctx.fill();

  // رسم شكل القلب (Bezier)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(size/100, size/100);
  ctx.beginPath();
  ctx.moveTo(0, 30);
  ctx.bezierCurveTo(-50, -20, -100, 20, 0, 100);
  ctx.bezierCurveTo(100, 20, 50, -20, 0, 30);
  ctx.closePath();
  const hg = ctx.createRadialGradient(-20, -10, 10, 0, 20, 80);
  hg.addColorStop(0, '#ff6b6b');
  hg.addColorStop(1, '#b71c1c');
  ctx.fillStyle = hg;
  ctx.fill();
  // لمعة
  ctx.beginPath();
  ctx.ellipse(-25, 0, 12, 18, -0.5, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fill();
  ctx.restore();

  // نبض إضافي (دوائر)
  ctx.strokeStyle = `rgba(255,100,100,${0.3 + Math.sin(time*0.005)*0.2})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, size * 1.4, 0, Math.PI*2);
  ctx.stroke();
}

// ==================== رسم الجراثيم ====================
function drawEnemies() {
  enemies.forEach(e => {
    const r = e.r * (1 + Math.sin(e.pulse) * 0.15);
    // توهج
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r*2);
    g.addColorStop(0, e.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(e.x, e.y, r*2, 0, Math.PI*2); ctx.fill();
    // جسم
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2);
    ctx.fillStyle = e.color; ctx.fill();
    // نواة
    ctx.beginPath(); ctx.arc(e.x - r*0.2, e.y - r*0.2, r*0.4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
  });
}

// ==================== رسم الجسيمات ====================
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ==================== حلقة اللعبة ====================
function loop(time) {
  const delta = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;

  // خلفية
  ctx.fillStyle = '#050a14';
  ctx.fillRect(0, 0, W, H);

  // نجوم متحركة
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 80; i++) {
    const x = (i * 137.5 + time * 0.02) % W;
    const y = (i * 73.3) % H;
    ctx.fillRect(x, y, 1.5, 1.5);
  }

  drawHeart(time);

  if (playing) {
    spawnTimer += delta;
    if (spawnTimer > Math.max(20, 60 - level * 5)) {
      spawnEnemy(); spawnTimer = 0;
    }
    const cx = W/2, cy = H/2;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dx = cx - e.x, dy = cy - e.y;
      const dist = Math.hypot(dx, dy);
      e.x += (dx / dist) * e.speed * delta;
      e.y += (dy / dist) * e.speed * delta;
      e.pulse += 0.1 * delta;

      if (dist < Math.min(W, H) * 0.12) {
        lives--; updateLives();
        explode(e.x, e.y, '#ff4444');
        enemies.splice(i, 1);
        document.body.style.background = '#200';
        setTimeout(() => document.body.style.background = '#050a14', 100);
        if (lives <= 0) endGame(false);
      }
    }
  }

  drawEnemies();
  drawParticles();

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * delta; p.y += p.vy * delta;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= 0.03 * delta;
    if (p.life <= 0) particles.splice(i, 1);
  }

  requestAnimationFrame(loop);
}

// ==================== النقر ====================
canvas.addEventListener('pointerdown', (e) => {
  if (!playing) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    if (Math.hypot(mx - en.x, my - en.y) < en.r * 2.2) {
      explode(en.x, en.y, en.color);
      enemies.splice(i, 1);
      score += 10; scoreEl.textContent = score;
      const nl = Math.floor(score / 50) + 1;
      if (nl > level) { level = nl; }
      if (score >= WIN) endGame(true);
      return;
    }
  }
});

// ==================== بدء/إنهاء ====================
function startGame() {
  score = 0; lives = 3; level = 1; playing = true;
  enemies = []; particles = []; spawnTimer = 0;
  scoreEl.textContent = score; updateLives();
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
}

function endGame(win) {
  playing = false;
  endTitle.textContent = win ? "أنقذت القلب! 🎉" : "انتهت اللعبة 💔";
  endTitle.style.color = win ? '#2ecc71' : '#e74c3c';
  endMsg.textContent = win ? `نقاطك: ${score}. أنت بطل!` : `نقاطك: ${score}. حاول مرة أخرى.`;
  endScreen.classList.remove('hidden');
}

document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;

requestAnimationFrame(loop);
</script>
</body>
</html>
